[workspace]
resolver = "3"
members = ["crates/bezel-core", "crates/bezel-rdp", "crates/bezel"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.lints.clippy]
# Bezel's large enums are events and screens held one at a time, never in bulk.
large_enum_variant = "allow"

[workspace.dependencies]
bezel-core = { path = "crates/bezel-core" }
bezel-rdp = { path = "crates/bezel-rdp" }

# Rune and IronRDP are pinned to one revision each (docs/adr/0001-ironrdp-as-the-rdp-engine.md).
# Bump a revision deliberately; Rune's bump also replaces every rev in [patch.crates-io] below.
rune = { git = "https://github.com/anomalyco/rune", rev = "ee84b9c8e3e8eecd0613554d850d8a2f431d844b" }
rune-image = { git = "https://github.com/anomalyco/rune", rev = "ee84b9c8e3e8eecd0613554d850d8a2f431d844b", default-features = false }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "ee84b9c8e3e8eecd0613554d850d8a2f431d844b", default-features = false }
rune-theme-opencode = { git = "https://github.com/anomalyco/rune", rev = "ee84b9c8e3e8eecd0613554d850d8a2f431d844b" }

ironrdp-client = { git = "https://github.com/Devolutions/IronRDP", rev = "a0ad31cb864a25ec077034db2d4ced19575d5c20", features = ["rustls"] }
ironrdp-connector = { git = "https://github.com/Devolutions/IronRDP", rev = "a0ad31cb864a25ec077034db2d4ced19575d5c20" }
ironrdp-input = { git = "https://github.com/Devolutions/IronRDP", rev = "a0ad31cb864a25ec077034db2d4ced19575d5c20" }
ironrdp-pdu = { git = "https://github.com/Devolutions/IronRDP", rev = "a0ad31cb864a25ec077034db2d4ced19575d5c20" }
ironrdp-session = { git = "https://github.com/Devolutions/IronRDP", rev = "a0ad31cb864a25ec077034db2d4ced19575d5c20" }
ironrdp-tls = { git = "https://github.com/Devolutions/IronRDP", rev = "a0ad31cb864a25ec077034db2d4ced19575d5c20", features = ["rustls"] }

anyhow = "1"
png = "0.18"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
toml = "0.9"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "registry"] }
x509-cert = { version = "0.3", default-features = false, features = ["std"] }

# Cargo does not inherit patches from a dependency, so Rune's own [patch.crates-io] list is
# repeated here at the same revision (Rune's README, "Depending on Rune").
[patch.crates-io]
winit = { git = "https://github.com/anomalyco/rune", rev = "ee84b9c8e3e8eecd0613554d850d8a2f431d844b" }
sctk-adwaita = { git = "https://github.com/anomalyco/rune", rev = "ee84b9c8e3e8eecd0613554d850d8a2f431d844b" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "ee84b9c8e3e8eecd0613554d850d8a2f431d844b" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "ee84b9c8e3e8eecd0613554d850d8a2f431d844b" }
naga = { git = "https://github.com/anomalyco/rune", rev = "ee84b9c8e3e8eecd0613554d850d8a2f431d844b" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "ee84b9c8e3e8eecd0613554d850d8a2f431d844b" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "ee84b9c8e3e8eecd0613554d850d8a2f431d844b" }
accesskit_atspi_common = { git = "https://github.com/anomalyco/rune", rev = "ee84b9c8e3e8eecd0613554d850d8a2f431d844b" }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
