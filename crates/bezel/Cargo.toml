[package]
name = "bezel"
description = "Bezel, an RDP client for the Mac."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
bezel-core.workspace = true
bezel-rdp.workspace = true
png.workspace = true
rune.workspace = true
rune-kit.workspace = true
rune-theme-opencode.workspace = true
time.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSMenu", "NSMenuItem", "NSPasteboard", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSUserDefaults"] }

[dev-dependencies]
tempfile = "3"
